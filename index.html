<title>채용 관제 콘솔</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gugi&display=swap">
<style>
  /* 레이아웃: 심우주 관제 콘솔 — 이름만 떠 있는 접안 모듈 12기 */
  :root {
    --void: #060a16;
    --panel: #0e1630;
    --panel-hi: #16214a;
    --grid-line: rgba(92, 196, 255, .14);
    --signal: #5ce1ff;
    --signal-dim: #2b7f9e;
    --flare: #ffb547;
    --ion: #b98cff;
    --text: #e6f1ff;
    --font-display: "Gugi", "Apple SD Gothic Neo", sans-serif;
    color-scheme: dark;
  }

  html, body { height: 100%; }

  body {
    display: flex;
    font-family: var(--font-display);
    color: var(--text);
    background:
      radial-gradient(90% 55% at 50% -5%, rgba(92,225,255,.18) 0%, transparent 70%),
      radial-gradient(70% 50% at 110% 25%, rgba(185,140,255,.14) 0%, transparent 70%),
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / 100% 46px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 46px 100%,
      var(--void);
    -webkit-font-smoothing: antialiased;
  }

  .bay {
    width: 100%;
    max-width: 680px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
  }
  @media (min-width: 520px) { .bay { grid-template-columns: repeat(3, 1fr); } }

  /* 모듈: 모서리를 깎아낸 접안 포트 */
  .mod {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 92px;
    padding: 14px 14px 14px 18px;
    text-align: center;
    text-decoration: none;
    color: var(--text);
    font-size: clamp(16px, 4.6vw, 19px);
    line-height: 1.3;
    overflow-wrap: anywhere;
    text-shadow: 0 0 16px rgba(92,225,255,.35);
    background:
      linear-gradient(160deg, rgba(92,225,255,.1) 0%, transparent 48%),
      linear-gradient(var(--panel-hi), var(--panel));
    border: 1px solid rgba(92,196,255,.28);
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .mod::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--signal-dim);
    transition: background .2s ease, box-shadow .2s ease;
  }
  .mod:hover, .mod:focus-visible {
    transform: translateY(-2px);
    border-color: var(--signal);
    box-shadow: 0 0 0 1px rgba(92,225,255,.3), 0 10px 26px rgba(0,0,0,.6);
  }
  .mod:hover::before, .mod:focus-visible::before {
    background: var(--signal);
    box-shadow: 0 0 12px var(--signal);
  }
  .mod:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
  .mod:active { transform: translateY(0); }

  /* 채널 등급: 카페 중계 / 수동 관측 */
  .mod.relay { border-color: rgba(185,140,255,.3); }
  .mod.relay::before { background: #6c4da3; }
  .mod.relay:hover, .mod.relay:focus-visible { border-color: var(--ion); box-shadow: 0 0 0 1px rgba(185,140,255,.3), 0 10px 26px rgba(0,0,0,.6); }
  .mod.relay:hover::before, .mod.relay:focus-visible::before { background: var(--ion); box-shadow: 0 0 12px var(--ion); }

  .mod.manual { border-color: rgba(255,181,71,.28); }
  .mod.manual::before { background: #99662a; }
  .mod.manual:hover, .mod.manual:focus-visible { border-color: var(--flare); box-shadow: 0 0 0 1px rgba(255,181,71,.3), 0 10px 26px rgba(0,0,0,.6); }
  .mod.manual:hover::before, .mod.manual:focus-visible::before { background: var(--flare); box-shadow: 0 0 12px var(--flare); }

  @media (prefers-reduced-motion: reduce) {
    .mod { transition: none; }
  }
</style>
