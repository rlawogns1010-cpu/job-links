<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
  /* 레이아웃: 애플 제품 그리드처럼 — 넉넉한 여백 위에 이름만 올린 카드 12장 */
  :root {
    --canvas: #f5f5f7;
    --card: #ffffff;
    --ink: #1d1d1f;
    --hairline: rgba(0, 0, 0, .06);
    --shadow: 0 4px 14px rgba(0, 0, 0, .06);
    --shadow-lift: 0 12px 28px rgba(0, 0, 0, .12);
    --focus: #0071e3;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Pretendard",
            "Apple SD Gothic Neo", "Helvetica Neue", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #000000;
      --card: #1d1d1f;
      --ink: #f5f5f7;
      --hairline: rgba(255, 255, 255, .1);
      --shadow: 0 4px 14px rgba(0, 0, 0, .5);
      --shadow-lift: 0 12px 28px rgba(0, 0, 0, .7);
      --focus: #2997ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --canvas: #000000;
    --card: #1d1d1f;
    --ink: #f5f5f7;
    --hairline: rgba(255, 255, 255, .1);
    --shadow: 0 4px 14px rgba(0, 0, 0, .5);
    --shadow-lift: 0 12px 28px rgba(0, 0, 0, .7);
    --focus: #2997ff;
    color-scheme: dark;
  }

  html, body { height: 100%; }

  body {
    display: flex;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  .grid {
    width: 100%;
    max-width: 760px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px;
  }
  @media (min-width: 560px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
  }

  .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 104px;
    padding: 20px 16px;
    text-align: center;
    text-decoration: none;
    color: var(--ink);
    font-size: clamp(16px, 4.4vw, 19px);
    font-weight: 600;
    letter-spacing: -.021em;
    line-height: 1.25;
    overflow-wrap: anywhere;
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    box-shadow: var(--shadow);
    transition: transform .3s cubic-bezier(.25, .1, .25, 1),
                box-shadow .3s cubic-bezier(.25, .1, .25, 1);
  }
  @media (min-width: 560px) { .tile { min-height: 128px; border-radius: 20px; } }

  .tile:hover {
    transform: scale(1.02);
    box-shadow: var(--shadow-lift);
  }
  .tile:active { transform: scale(.985); }
  .tile:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; }
  }
</style>
